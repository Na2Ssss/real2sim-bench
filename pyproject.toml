[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "r2s-bench"
version = "0.2.0"
description = "Real2Sim-Bench: Closed-book benchmark for evaluating Agentic Real-to-Sim reconstruction via hidden real-robot teleoperation replay."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "mujoco>=3.2",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "h5py>=3.10",
    "huggingface_hub>=0.24",
    "pyyaml>=6.0",
    "robot-descriptions>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["r2s_bench*"]
